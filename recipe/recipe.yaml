schema_version: 1

context:
  name: llama-index-core
  version: 0.14.26

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/llama_index_core-${{ version }}.tar.gz
  sha256: dba58bc3fdb4e0a9fb52f8c53123d5a2576b3a8a991b65cd6d19796295f0bcd9

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - aiohttp >=3.8.6,<4
    - aiosqlite
    - banks >=2.3.0,<3
    - dataclasses-json
    - deprecated >=1.2.9.3
    - dirtyjson >=1.0.8,<2
    - filetype >=1.2.0,<2
    - fsspec >=2023.5.0
    - httpx
    - llama-index-workflows >=2.14.0,<3
    - nest-asyncio >=1.5.8,<2
    - networkx >=3.0
    - nltk >=3.9.3
    - numpy
    - pillow >=9.0.0
    - platformdirs
    - pydantic >=2.8.0
    - python >=${{ python_min }},<4.0
    - pyyaml >=6.0.1
    - requests >=2.31.0
    - setuptools >=80.9.0
    - sqlalchemy-with-asyncio >=1.4.49
    - tenacity >=8.2.0,!=8.4.0,<10.0.0
    - tiktoken >=0.7.0
    - tinytag >=2.2.0
    - tqdm >=4.66.1,<5
    - typing_extensions >=4.5.0
    - typing_inspect >=0.8.0
    - wrapt

tests:
  - python:
      imports:
        - llama_index.core
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Interface between LLMs and your data
  license: MIT
  license_file: LICENSE
  homepage: https://llamaindex.ai
  repository: https://github.com/run-llama/llama_index/tree/main/llama-index-core

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw
